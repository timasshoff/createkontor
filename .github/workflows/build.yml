name: Build

on: [workflow_dispatch, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # The jar only exists on the runner, which is thrown away when the job ends.
      # Without an upload step there is nothing to download.
      # Runs only if the build (including the tests) succeeded.
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: createkontor-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Runs only if something above failed. The test reports are the one place where the
      # full stack trace of a test failure is written down.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore
